version: "3.2"

services:

  web:
    build:
      context: ./..
      dockerfile: dev/web/Containerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-latest}
    environment:
      EXT_UID: ${UID}
      EXT_GID: ${GID}
      EXT_USER: ${USER}
    depends_on:
      - db
    networks:
      - backend
    ports:
      - "8008:80"
    volumes:
      - ../src:/src:ro
      - ./web/assets/foodsoft.conf:/etc/apache2/sites-available/foodsoft.conf
    container_name: ${CONTAINER_PREFIX}php
    command: /opt/bin/start-web.sh

  db:
    image: mariadb:${MARIADB_VERSION:-latest}
    restart: always
    ports:
      - 3306:3306
    volumes:
      - ${DB_DATADIR}:/var/lib/mysql
      - ./db/config:/etc/mysql/mariadb.conf.d
    networks:
      - backend
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${DB_NAME}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    container_name: ${CONTAINER_PREFIX}mariadb

  dokuwiki:
    # https://hub.docker.com/r/linuxserver/dokuwiki
    image: ghcr.io/linuxserver/dokuwiki:${DOKUWIKI_VERSION:-latest}
    container_name: ${CONTAINER_PREFIX}dokuwiki
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Berlin
    tty: true
    volumes:
      - ${DOKUWIKI_DATADIR}/config:/config
      - ../dokuwiki_auth_plugin/authfoodsoft:/config/dokuwiki/lib/plugins/authfoodsoft
    ports:
      - 7080:80
      - 7443:443 #optional
    restart: unless-stopped

  adminer:
    image: adminer:${ADMINER_VERSION:-latest}
    ports:
      - 8080:8080
    networks:
      - backend
    restart: always
    container_name: ${CONTAINER_PREFIX}adminer

networks:
  backend:

volumes:
  dbdata:
